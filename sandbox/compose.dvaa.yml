# Prepared offline target profile; startup has not been runtime-verified.
# Source inspection pinned to DVAA 0.9.3 at this commit.
name: counterforge-targets
services:
  dvaa:
    build:
      context: https://github.com/opena2a-org/damn-vulnerable-ai-agent.git#57918267d8d529ceec6d40fc9836ab09d128eee4
    command: [node, src/index.js, --only, "ragbot,ragbot-aim", --offline]
    environment:
      DVAA_HOST: 0.0.0.0
      OPENA2A_TELEMETRY: 'off'
      DVAA_AIM_DATA_DIR: /tmp/aim
    ports:
      - 127.0.0.1:7005:7005
      - 127.0.0.1:7014:7014
    networks: [lab]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    init: true
    restart: 'no'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:7005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
networks:
  lab:
    internal: true
